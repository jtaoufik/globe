<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fleet Globe</title>
<style>
  :root { --bg:#05070d; --fg:#e6e9f0; --muted:#8b93a7; --panel:rgba(12,16,28,.86); --line:rgba(255,255,255,.1); --grid:rgba(255,255,255,.07); }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html,body { margin:0; height:100%; background:var(--bg); color:var(--fg); font:14px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,sans-serif; overflow:hidden; touch-action:none; }
  #globe { position:absolute; inset:0; z-index:0; }
  #graph { position:absolute; inset:0; z-index:5; display:none; padding:calc(64px + env(safe-area-inset-top)) 16px 190px 16px; }
  #graph.on { display:block; }
  #graph .frame { position:relative; width:100%; height:100%; }
  #chart { width:100%; height:100%; display:block; }
  .panel { position:absolute; z-index:10; background:var(--panel); backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px); border:1px solid var(--line); border-radius:14px; padding:12px 14px; touch-action:manipulation; }
  #legend { top:calc(12px + env(safe-area-inset-top)); left:12px; min-width:186px; }
  #legend h1 { font-size:15px; margin:0 0 6px; font-weight:600; }
  #legend .app { display:flex; align-items:center; gap:8px; padding:6px 2px; cursor:pointer; user-select:none; min-height:32px; }
  #legend .app.off { opacity:.35; }
  #legend .dot { width:11px; height:11px; border-radius:50%; flex:none; box-shadow:0 0 8px currentColor; }
  #legend .n { margin-left:auto; color:var(--muted); font-variant-numeric:tabular-nums; }
  #legend .total { border-top:1px solid var(--line); margin-top:6px; padding-top:6px; color:var(--muted); display:flex; }
  #legend .total b { color:var(--fg); margin-left:auto; font-variant-numeric:tabular-nums; }
  #view { top:calc(12px + env(safe-area-inset-top)); right:12px; padding:6px; }
  #controls { left:50%; bottom:calc(14px + env(safe-area-inset-bottom)); transform:translateX(-50%); width:min(760px, calc(100vw - 24px)); }
  .row { display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .row + .row { margin-top:10px; }
  #date { font-size:16px; font-weight:600; font-variant-numeric:tabular-nums; flex:1 1 auto; }
  .seg { display:flex; border:1px solid var(--line); border-radius:10px; overflow:hidden; }
  .seg button { background:transparent; color:var(--muted); border:0; padding:9px 13px; min-height:38px; cursor:pointer; font:inherit; touch-action:manipulation; }
  .seg button.on { background:rgba(255,255,255,.14); color:var(--fg); }
  input[type=range] { width:100%; margin:12px 0 2px; accent-color:#7c9cff; touch-action:pan-x; height:28px; }
  .graph-only { display:none; } body.graph .graph-only { display:flex; } body.graph .globe-only { display:none !important; }
  #meta { position:absolute; z-index:10; right:12px; top:calc(58px + env(safe-area-inset-top)); color:var(--muted); font-size:12px; text-align:right; max-width:40vw; }
  #tip { position:absolute; z-index:20; pointer-events:none; background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 10px; font-size:12px; display:none; max-width:260px; }
  #tip b { display:block; font-size:13px; }
  #tip .r { display:flex; gap:8px; align-items:center; } #tip .r i { width:8px; height:8px; border-radius:50%; display:inline-block; } #tip .r span:last-child { margin-left:auto; font-variant-numeric:tabular-nums; }
  @media (max-width:640px) {
    #legend { min-width:0; padding:10px 12px; font-size:13px; }
    #legend h1 { display:none; }
    #legend .app { padding:4px 0; min-height:28px; }
    #meta { display:none; }
    #date { font-size:14px; }
    .seg button { padding:9px 11px; font-size:13px; }
    #graph { padding:calc(56px + env(safe-area-inset-top)) 8px 200px 8px; }
  }
</style>
</head>
<body>
<div id="globe"></div>
<div id="graph"><div class="frame"><canvas id="chart"></canvas></div></div>
<div id="legend" class="panel"><h1>Fleet Globe</h1><div id="apps"></div><div class="total"><span id="totalLabel">users</span><b id="total">0</b></div></div>
<div id="view" class="panel seg"><button data-v="globe" class="on">Globe</button><button data-v="graph">Graph</button></div>
<div id="meta"></div>
<div id="controls" class="panel">
  <div class="row">
    <div class="seg" id="metric">
      <button data-k="u" class="on">Active</button>
      <button data-k="n">First-time</button>
      <button data-k="r" title="GA4 app_remove event: Android only">Uninstalls</button>
    </div>
    <div class="seg" id="platform">
      <button data-p="all" class="on">All</button>
      <button data-p="iOS">iOS</button>
      <button data-p="Android">Android</button>
    </div>
    <div class="seg globe-only" id="range">
      <button data-m="1" class="on">Day</button>
      <button data-m="7">7 days</button>
      <button data-m="30">30 days</button>
    </div>
    <div class="seg graph-only" id="period">
      <button data-d="7">7 days</button>
      <button data-d="30" class="on">30 days</button>
      <button data-d="90">90 days</button>
    </div>
  </div>
  <div class="row"><div id="date"></div><span id="note" style="color:var(--muted);font-size:12px"></span></div>
  <input id="slider" class="globe-only" type="range" min="0" max="0" value="0" aria-label="Day">
</div>
<div id="tip"></div>

<script src="https://cdn.jsdelivr.net/npm/globe.gl@2.35.0/dist/globe.gl.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script>
(async function () {
  const data = await (await fetch('/data.json?ts=' + Date.now())).json();
  const apps = data.apps, colour = Object.fromEntries(apps.map(a => [a.id, a.color]));
  const enabled = Object.fromEntries(apps.map(a => [a.id, true]));
  const dates = [...new Set(data.points.map(p => p.d))].sort();
  const LABEL = { u: 'active users', n: 'first-time users', r: 'uninstalls' };
  let idx = dates.length - 1, span = 1, metric = 'u', platform = 'all', view = 'globe', period = 30;
  const fmt = s => s ? `${s.slice(0, 4)}-${s.slice(4, 6)}-${s.slice(6, 8)}` : 'no data';
  const inPlatform = p => platform === 'all' || p.p === platform;

  // ---- legend (tap an app to hide / show it; shared by both views)
  const appsEl = document.getElementById('apps');
  for (const a of apps) {
    const el = document.createElement('div'); el.className = 'app';
    el.innerHTML = `<span class="dot" style="color:${a.color};background:${a.color}"></span><span>${a.name}</span><span class="n" id="n-${a.id}">0</span>`;
    el.addEventListener('click', () => { enabled[a.id] = !enabled[a.id]; el.classList.toggle('off', !enabled[a.id]); render(); });
    appsEl.appendChild(el);
  }
  document.getElementById('meta').textContent = 'GA4 · updated ' + data.generated.replace('T', ' ').slice(0, 16) + ' UTC';

  // ---- globe
  const globe = Globe()(document.getElementById('globe'))
    .globeImageUrl('https://cdn.jsdelivr.net/npm/three-globe@2.31.0/example/img/earth-night.jpg')
    .bumpImageUrl('https://cdn.jsdelivr.net/npm/three-globe@2.31.0/example/img/earth-topology.png')
    .backgroundImageUrl('https://cdn.jsdelivr.net/npm/three-globe@2.31.0/example/img/night-sky.png')
    .atmosphereColor('#7c9cff').atmosphereAltitude(0.18)
    .pointLat('lat').pointLng('lng').pointColor(p => colour[p.a])
    .pointAltitude(p => 0.01 + Math.min(0.25, Math.log10(p.v + 1) * 0.06))
    .pointRadius(p => 0.25 + Math.min(1.2, Math.log10(p.v + 1) * 0.45)).pointsMerge(false)
    .onPointHover(p => showTip(p)).onPointClick(p => showTip(p));
  globe.controls().autoRotate = true; globe.controls().autoRotateSpeed = 0.6;
  globe.controls().addEventListener('start', () => { globe.controls().autoRotate = false; });
  globe.pointOfView({ lat: 25, lng: 10, altitude: innerWidth < 640 ? 2.8 : 2.1 }, 0);
  addEventListener('resize', () => globe.width(innerWidth).height(innerHeight));

  function selectedPoints() {
    const days = new Set(dates.slice(Math.max(0, idx - span + 1), idx + 1));
    const agg = new Map();
    for (const p of data.points) {
      if (!days.has(p.d) || !enabled[p.a] || !inPlatform(p)) continue;
      const v = p[metric] || 0; if (!v) continue;
      const k = p.a + '|' + p.lat + '|' + p.lng;
      const cur = agg.get(k);
      if (cur) { cur.v += v; cur.u += p.u; cur.n += p.n; cur.r += p.r; cur.platforms.add(p.p); }
      else agg.set(k, { ...p, v, platforms: new Set([p.p]) });
    }
    return [...agg.values()];
  }

  // ---- graph: one line per app, the chosen metric per day, over the chosen period
  Chart.defaults.color = '#8b93a7'; Chart.defaults.font.family = getComputedStyle(document.body).fontFamily;
  const chart = new Chart(document.getElementById('chart'), {
    type: 'line',
    data: { labels: [], datasets: [] },
    options: {
      responsive: true, maintainAspectRatio: false, animation: false, interaction: { mode: 'index', intersect: false },
      elements: { line: { borderWidth: 2, tension: 0.25 }, point: { radius: 3, hoverRadius: 6, hitRadius: 12, borderWidth: 2, borderColor: '#05070d' } },
      plugins: {
        legend: { display: false },
        tooltip: { enabled: false, external: ctx => graphTip(ctx) },
      },
      scales: {
        x: { grid: { color: 'rgba(0,0,0,0)' }, ticks: { maxRotation: 0, autoSkip: true, maxTicksLimit: innerWidth < 640 ? 5 : 10 }, border: { color: 'var(--line)' } },
        y: { beginAtZero: true, grid: { color: 'rgba(255,255,255,.07)' }, ticks: { precision: 0 }, border: { display: false } },
      },
    },
  });
  function series() {
    const days = dates.slice(Math.max(0, dates.length - period));
    const per = {}; for (const a of apps) per[a.id] = Object.fromEntries(days.map(d => [d, 0]));
    const dayset = new Set(days);
    for (const p of data.points) { if (dayset.has(p.d) && inPlatform(p)) per[p.a][p.d] += p[metric] || 0; }
    return { days, per };
  }
  function graphTip(ctx) {
    const tip = document.getElementById('tip'), t = ctx.tooltip;
    if (!t || t.opacity === 0 || !t.dataPoints?.length) { tip.style.display = 'none'; return; }
    const rows = t.dataPoints.slice().sort((a, b) => b.raw - a.raw)
      .map(dp => `<div class="r"><i style="background:${dp.dataset.borderColor}"></i><span>${dp.dataset.label}</span><span>${dp.raw}</span></div>`).join('');
    tip.innerHTML = `<b>${t.title[0]}</b>${rows}`;
    const box = ctx.chart.canvas.getBoundingClientRect();
    tip.style.display = 'block';
    tip.style.left = Math.min(innerWidth - 270, box.left + t.caretX + 14) + 'px';
    tip.style.top = (box.top + t.caretY - 10) + 'px';
  }

  function render() {
    document.body.classList.toggle('graph', view === 'graph');
    document.getElementById('graph').classList.toggle('on', view === 'graph');
    document.getElementById('totalLabel').textContent = LABEL[metric];
    document.getElementById('note').textContent = metric === 'r' ? 'Android only (GA4 app_remove)' : (platform === 'all' ? '' : platform);
    const per = Object.fromEntries(apps.map(a => [a.id, 0])); let total = 0;
    if (view === 'globe') {
      const pts = selectedPoints(); globe.pointsData(pts);
      for (const p of pts) { per[p.a] += p.v; total += p.v; }
      const d = dates[idx] || '';
      document.getElementById('date').textContent = span === 1 ? fmt(d) : `${fmt(dates[Math.max(0, idx - span + 1)])} → ${fmt(d)}`;
      document.getElementById('slider').value = idx;
    } else {
      const s = series();
      chart.data.labels = s.days.map(fmt);
      chart.data.datasets = apps.filter(a => enabled[a.id]).map(a => ({
        label: a.name, data: s.days.map(d => s.per[a.id][d]), borderColor: a.color, backgroundColor: a.color, pointBackgroundColor: a.color, spanGaps: true,
      }));
      chart.options.scales.x.ticks.maxTicksLimit = innerWidth < 640 ? 5 : 10;
      chart.update();
      for (const a of apps) { const sum = Object.values(s.per[a.id]).reduce((x, y) => x + y, 0); per[a.id] = sum; if (enabled[a.id]) total += sum; }
      document.getElementById('date').textContent = `${fmt(s.days[0])} → ${fmt(s.days[s.days.length - 1])} · ${LABEL[metric]} per day`;
      document.getElementById('tip').style.display = 'none';
    }
    for (const a of apps) document.getElementById('n-' + a.id).textContent = enabled[a.id] ? per[a.id] : '–';
    document.getElementById('total').textContent = total;
  }

  const slider = document.getElementById('slider'); slider.max = Math.max(0, dates.length - 1); slider.value = idx;
  slider.addEventListener('input', () => { idx = +slider.value; render(); });
  function segment(id, attr, apply) {
    const btns = [...document.querySelectorAll('#' + id + ' button')];
    for (const b of btns) b.addEventListener('click', e => { e.preventDefault(); apply(b.dataset[attr]); btns.forEach(x => x.classList.toggle('on', x === b)); render(); });
  }
  segment('range', 'm', v => { span = +v; });
  segment('period', 'd', v => { period = +v; });
  segment('metric', 'k', v => { metric = v; });
  segment('platform', 'p', v => { platform = v; });
  segment('view', 'v', v => { view = v; });
  addEventListener('resize', () => { if (view === 'graph') render(); });

  // ---- globe tooltip (hover on desktop, tap on touch)
  const tip = document.getElementById('tip'); let mouse = { x: 0, y: 0 };
  addEventListener('pointermove', e => { mouse = { x: e.clientX, y: e.clientY }; if (view === 'globe' && tip.style.display === 'block') place(); });
  function place() { tip.style.left = Math.min(innerWidth - 270, mouse.x + 14) + 'px'; tip.style.top = (mouse.y + 14) + 'px'; }
  function showTip(p) {
    if (view !== 'globe') return;
    if (!p) { tip.style.display = 'none'; return; }
    const name = apps.find(a => a.id === p.a).name;
    tip.innerHTML = `<b style="color:${colour[p.a]}">${name}</b>${p.city ? p.city + ', ' : ''}${p.country}<br>` +
      `${p.u} active · ${p.n} first-time · ${p.r} uninstall${p.r === 1 ? '' : 's'} · ${[...p.platforms].join(' + ')}`;
    tip.style.display = 'block'; place();
  }
  render();
})();
</script>
</body>
</html>
